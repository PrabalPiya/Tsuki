name: Manga catalog

on:
  workflow_dispatch:
  schedule:
    # Refresh four times daily, offset from the busy top-of-hour window.
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # AniList is currently capped at 30 requests/minute and also burst-limits.
      - run: dart run tool/build_catalog.dart --pages 80 --per-page 50 --delay-ms 2200 --max-retries 5 --out ../public/catalog.json
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
