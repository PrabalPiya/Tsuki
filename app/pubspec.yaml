name: tsuki
description: Tsuki, a calm, source-independent, open-source manga reader.
publish_to: none
version: 1.0.2+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.12
  dio: ^5.8.0+1
  firebase_app_check: ^0.3.2+10
  firebase_auth: ^5.7.0
  firebase_core: ^3.15.2
  flutter_riverpod: ^2.6.1
  flutter_cache_manager: ^3.4.1
  go_router: ^16.0.0
  google_sign_in: ^6.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/quiet_reader_icon.png
